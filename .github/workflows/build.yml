name: Build KernelSU module

on:
  workflow_dispatch:
    inputs:
      dock_count:
        description: "Dock count to put in the module config"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "6"
          - "7"
          - "8"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang unzip zip curl file

      - name: Download Android NDK directly
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="r27d"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          curl -fL --retry 5 --retry-all-errors "${NDK_URL}" -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d /tmp
          test -x "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      - name: Fetch Zygisk header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/include zygisk
          curl -fL --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp" \
            -o native/include/zygisk.hpp
          test -s native/include/zygisk.hpp

      - name: Build ARM64 Zygisk library
        shell: bash
        run: |
          set -euo pipefail
          NDK="/tmp/android-ndk-r27d"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CLANG" -std=c++17 -fPIC -shared -O2 -fvisibility=hidden \
            -I native/include native/main.cpp \
            -o zygisk/arm64-v8a.so \
            -llog
          file zygisk/arm64-v8a.so
          test -s zygisk/arm64-v8a.so

      - name: Set selected dock count
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^DOCK_COUNT=.*/DOCK_COUNT=${{ inputs.dock_count }}/" config/dock.conf
          grep -Fx "DOCK_COUNT=${{ inputs.dock_count }}" config/dock.conf

      - name: Package module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/oplus_dock_grid/zygisk
          cp module.prop customize.sh service.sh action.sh out/oplus_dock_grid/
          cp -a config out/oplus_dock_grid/
          cp zygisk/arm64-v8a.so out/oplus_dock_grid/zygisk/
          cd out
          zip -r9 "../oplus-dock-grid-${{ inputs.dock_count }}-${GITHUB_SHA::7}.zip" oplus_dock_grid
          cd ..
          unzip -t "oplus-dock-grid-${{ inputs.dock_count }}-${GITHUB_SHA::7}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oplus-dock-grid-${{ inputs.dock_count }}
          path: oplus-dock-grid-${{ inputs.dock_count }}-${GITHUB_SHA::7}.zip
          if-no-files-found: error
