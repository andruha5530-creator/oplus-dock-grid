name: Build KernelSU module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "cmdline-tools;latest"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      - name: Build Zygisk ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/include zygisk
          curl -fsSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp \
            -o native/include/zygisk.hpp
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CLANG" -std=c++17 -fPIC -shared -O2 -fvisibility=hidden \
            -I native/include native/main.cpp \
            -o zygisk/arm64-v8a.so \
            -llog
          file zygisk/arm64-v8a.so

      - name: Package module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/oplus_dock_grid/zygisk
          cp module.prop customize.sh service.sh action.sh out/oplus_dock_grid/
          cp -a config out/oplus_dock_grid/
          cp zygisk/arm64-v8a.so out/oplus_dock_grid/zygisk/
          cd out
          zip -r9 ../oplus-dock-grid-${GITHUB_SHA::7}.zip oplus_dock_grid

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oplus-dock-grid
          path: oplus-dock-grid-*.zip
